name: digitalfix-rabbitmq-cluster

services:
    rabbitmq-node1:
        image: rabbitmq:4.2-management
        hostname: rabbitmq-node1
        environment:
            RABBITMQ_NODENAME: rabbit@rabbitmq-node1
            RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Configure RABBITMQ_ERLANG_COOKIE in .env}
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-digitalfix}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD in .env}
        ports:
            - "127.0.0.1:5673:5672"
            - "127.0.0.1:15673:15672"
        volumes:
            - rabbitmq_node1_data_v2:/var/lib/rabbitmq
        networks:
            - rabbitmq_cluster
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
            interval: 10s
            timeout: 10s
            retries: 15
            start_period: 20s
        restart: unless-stopped

    rabbitmq-node2:
        image: rabbitmq:4.2-management
        hostname: rabbitmq-node2
        environment:
            RABBITMQ_NODENAME: rabbit@rabbitmq-node2
            RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Configure RABBITMQ_ERLANG_COOKIE in .env}
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-digitalfix}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD in .env}
        ports:
            - "127.0.0.1:5674:5672"
            - "127.0.0.1:15674:15672"
        volumes:
            - rabbitmq_node2_data_v2:/var/lib/rabbitmq
            - ./scripts/join-cluster.sh:/opt/digitalfix/join-cluster.sh:ro
        networks:
            - rabbitmq_cluster
        depends_on:
            rabbitmq-node1:
                condition: service_started
        command: ["/bin/sh", "/opt/digitalfix/join-cluster.sh"]
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
            interval: 10s
            timeout: 10s
            retries: 15
            start_period: 30s
        restart: unless-stopped

networks:
    rabbitmq_cluster:
        driver: bridge

volumes:
    rabbitmq_node1_data_v2:
    rabbitmq_node2_data_v2:
